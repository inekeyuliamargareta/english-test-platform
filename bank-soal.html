<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Soal — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="data/dummy.js"></script>
<script src="assets/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-shell="app" data-active="bank" data-title="Bank Soal">
<main x-data="bank()">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Bank Soal</h2>
      <p class="mt-1 text-sm text-slate-500">Kumpulan soal lengkap dengan kunci dan pembahasan berbahasa Indonesia.</p>
    </div>
    <div class="relative sm:w-80">
      <i data-lucide="search" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
      <input x-model.debounce.250ms="f.q" type="search" placeholder="Cari kata di soal atau topik…" class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-3 text-sm shadow-sm outline-none focus:border-accent focus:ring-4 focus:ring-accent/10">
    </div>
  </div>

  <div class="mt-6 grid gap-6 lg:grid-cols-[260px_1fr]">
    <!-- Filter -->
    <aside class="lg:sticky lg:top-24 lg:self-start" x-data="{ open: false }">
      <button @click="open=!open" class="flex w-full items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold shadow-sm lg:hidden">
        <span class="flex items-center gap-2"><i data-lucide="sliders-horizontal" class="h-4 w-4"></i>Filter <span x-show="activeCount" class="rounded-full bg-accent px-2 text-xs text-white" x-text="activeCount"></span></span>
        <span class="inline-block transition" :class="open && 'rotate-180'"><i data-lucide="chevron-down" class="h-4 w-4"></i></span>
      </button>
      <div x-show="open" class="mt-3 space-y-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-soft lg:!block lg:mt-0">
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Ujian</p>
          <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-100 p-1 text-xs font-semibold">
            <template x-for="e in [['all','Semua'], ...activeExams().map(e => [e.key, e.name.split(' ')[0]])]">
              <button @click="f.exam=e[0]; f.section='all'; f.topic='all'" class="rounded-lg py-1.5 transition" :class="f.exam===e[0] ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'" x-text="e[1]"></button>
            </template>
          </div>
        </div>
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Section</p>
          <select x-model="f.section" @change="f.topic='all'" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-accent">
            <option value="all">Semua section</option>
            <template x-for="s in sectionOpts" :key="s"><option :value="s" x-text="s.charAt(0).toUpperCase() + s.slice(1)"></option></template>
          </select>
        </div>
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Topik</p>
          <select x-model="f.topic" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-accent">
            <option value="all">Semua topik</option>
            <template x-for="t in topicOpts" :key="t"><option :value="t" x-text="t"></option></template>
          </select>
        </div>
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Tingkat kesulitan</p>
          <div class="space-y-1.5">
            <template x-for="d in ['mudah','sedang','sulit']">
              <label class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2 py-1.5 text-sm capitalize hover:bg-slate-50">
                <input type="checkbox" :value="d" x-model="f.diff" class="h-4 w-4 rounded accent-[rgb(var(--accent))]"><span x-text="d"></span>
                <span class="ml-auto text-xs text-slate-400" x-text="QS.filter(q => q.difficulty===d).length"></span>
              </label>
            </template>
          </div>
        </div>
        <button @click="reset()" class="w-full rounded-xl border border-slate-200 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Reset filter</button>
      </div>
    </aside>

    <!-- Daftar soal -->
    <div class="min-w-0">
      <div class="mb-4 flex items-center justify-between text-sm text-slate-500">
        <span>Menampilkan <b class="text-slate-900" x-text="list.length"></b> dari <span x-text="QS.length"></span> soal</span>
        <button @click="openAll=!openAll; open = openAll ? list.map(q => q.id) : []" class="font-medium text-accent hover:underline" x-text="openAll ? 'Tutup semua pembahasan' : 'Buka semua pembahasan'"></button>
      </div>

      <div x-show="loading" class="space-y-4"><template x-for="i in 4"><div class="rounded-2xl border border-slate-200 bg-white p-6"><div class="skel h-4 w-40"></div><div class="skel mt-4 h-5 w-full"></div><div class="skel mt-2 h-5 w-2/3"></div><div class="mt-5 grid grid-cols-2 gap-2"><div class="skel h-10"></div><div class="skel h-10"></div></div></div></template></div>

      <div x-show="!loading" class="space-y-4">
        <template x-for="q in list" :key="q.id">
          <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft transition hover:border-slate-300 sm:p-6">
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <span class="rounded-md px-2 py-0.5 font-semibold text-white" :style="examStyle(q.exam)" x-text="DB.exams[q.exam].name"></span>
              <span class="rounded-md bg-slate-100 px-2 py-0.5 capitalize text-slate-600" x-text="q.section"></span>
              <span class="rounded-md bg-slate-100 px-2 py-0.5 text-slate-600" x-text="q.topic"></span>
              <span class="rounded-md px-2 py-0.5 capitalize" :class="diffClass[q.difficulty]" x-text="q.difficulty"></span>
              <span class="ml-auto font-mono text-slate-400" x-text="'#' + q.id.toUpperCase()"></span>
            </div>
            <p x-show="q.clip" class="mt-3 flex items-center gap-1.5 text-xs text-slate-500"><i data-lucide="headphones" class="h-3.5 w-3.5"></i><span x-text="'Audio: ' + (DB.clips[q.clip]?.title || '')"></span></p>
            <p x-show="q.passage" class="mt-3 flex items-center gap-1.5 text-xs text-slate-500"><i data-lucide="file-text" class="h-3.5 w-3.5"></i><span x-text="'Passage: ' + (DB.passages[q.passage]?.title || '')"></span></p>
            <p class="stem mt-3 font-medium leading-relaxed" x-html="stemHTML(q)"></p>

            <div x-show="q.type !== 'fill'" class="mt-4 grid gap-2 sm:grid-cols-2">
              <template x-for="(o, j) in (q.options || [])" :key="j">
                <button @click="pick[q.id] = j; if (!open.includes(q.id)) open.push(q.id)" class="flex items-center gap-3 rounded-xl border-2 px-3.5 py-2.5 text-left text-sm transition"
                  :class="!open.includes(q.id) ? 'border-slate-200 hover:border-accent/50 hover:bg-accent-soft' : j===q.answer ? 'border-emerald-500 bg-emerald-50' : j===pick[q.id] ? 'border-rose-400 bg-rose-50' : 'border-slate-100 text-slate-500'">
                  <span class="grid h-6 w-6 shrink-0 place-items-center rounded-md text-xs font-bold" :class="open.includes(q.id) && j===q.answer ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'" x-text="L(j)"></span><span x-text="o"></span>
                </button>
              </template>
            </div>
            <p x-show="q.type === 'fill'" class="mt-3 text-sm text-slate-500">Soal isian singkat.</p>

            <div class="mt-4 border-t border-slate-100 pt-3">
              <button @click="open.includes(q.id) ? open.splice(open.indexOf(q.id), 1) : open.push(q.id)" class="flex items-center gap-1.5 text-sm font-semibold text-accent">
                <i data-lucide="lightbulb" class="h-4 w-4"></i><span x-text="open.includes(q.id) ? 'Sembunyikan pembahasan' : 'Lihat kunci & pembahasan'"></span>
              </button>
              <div x-show="open.includes(q.id)" x-transition class="mt-3 rounded-xl bg-amber-50 p-4 text-sm leading-relaxed text-slate-700">
                <p class="font-semibold text-slate-900">Kunci: <span x-text="correctText(q)"></span>
                  <span x-show="q.id in pick" class="ml-2 font-normal" :class="pick[q.id]===q.answer ? 'text-emerald-600' : 'text-rose-600'" x-text="pick[q.id]===q.answer ? '· Jawabanmu benar ✓' : '· Jawabanmu: ' + L(pick[q.id])"></span></p>
                <p class="mt-1.5" x-html="q.explain"></p>
                <a :href="'materi-detail.html?id=' + q.chapter" class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-accent hover:underline">Pelajari materinya <i data-lucide="arrow-right" class="h-3 w-3"></i></a>
              </div>
            </div>
          </article>
        </template>

        <div x-show="!list.length" class="flex flex-col items-center rounded-2xl border-2 border-dashed border-slate-200 bg-white px-6 py-16 text-center">
          <span class="grid h-14 w-14 place-items-center rounded-2xl bg-slate-100 text-slate-400"><i data-lucide="inbox" class="h-7 w-7"></i></span>
          <h4 class="mt-4 font-semibold">Tidak ada soal yang cocok</h4>
          <p class="mt-1 max-w-sm text-sm text-slate-500">Coba kurangi filter atau gunakan kata kunci lain.</p>
          <button @click="reset()" class="mt-5 rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-accent-dark">Reset filter</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// Soal section yang dilatih bersama tutor (booking) tidak tampil di bank soal
const QS = DB.questions.filter(q => isActiveExam(q.exam) && !sectionMeta(q.exam, q.section).booking);
function bank() {
  const blank = () => ({ exam: getExam(), section: 'all', topic: 'all', diff: [], q: '' });
  return {
    f: blank(), open: [], pick: {}, openAll: false, loading: true,
    get pool() { return QS.filter(q => (this.f.exam === 'all' || q.exam === this.f.exam) && (this.f.section === 'all' || q.section === this.f.section)); },
    get sectionOpts() { return [...new Set(QS.filter(q => this.f.exam === 'all' || q.exam === this.f.exam).map(q => q.section))]; },
    get topicOpts() { return [...new Set(this.pool.map(q => q.topic))].sort(); },
    get activeCount() { return (this.f.section !== 'all') + (this.f.topic !== 'all') + (this.f.diff.length > 0); },
    get list() {
      const k = this.f.q.toLowerCase();
      return this.pool.filter(q => (this.f.topic === 'all' || q.topic === this.f.topic) && (!this.f.diff.length || this.f.diff.includes(q.difficulty))
        && (q.q + ' ' + q.topic + ' ' + (q.options || []).join(' ')).toLowerCase().includes(k));
    },
    reset() { this.f = blank(); this.f.exam = 'all'; },
    init() {
      setTimeout(() => this.loading = false, 500);
      // skeleton singkat saat filter berubah, meniru request ke server
      this.$watch('f', () => { this.loading = true; clearTimeout(this._t); this._t = setTimeout(() => this.loading = false, 300); }, { deep: true });
    },
  };
}
</script>
</body>
</html>
