<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebooks — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<!-- Ebook berbayar hanya bisa dibuka siswa Akses Penuh (dicek di server) -->
<body data-shell="app" data-active="ebook" data-title="Ebooks">
<main x-data="ebooks()" class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold tracking-tight" x-text="E.name + ' Ebooks'"></h2>
    <p class="mt-1 text-slate-500">Study materials you can read anytime. <span x-show="!access.full">Premium ebooks are available for students with full access.</span></p>
  </div>

  <div class="flex gap-2">
    <template x-for="f in [['all', 'All'], ['free', 'Free'], ['paid', 'Premium']]" :key="f[0]">
      <button @click="filter = f[0]" class="rounded-xl px-4 py-2 text-sm font-medium transition" :class="filter === f[0] ? 'bg-slate-900 text-white' : 'border border-slate-200 bg-white text-slate-600 hover:bg-slate-50'" x-text="f[1] + ' (' + count(f[0]) + ')'"></button>
    </template>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    <template x-for="e in list" :key="e.id">
      <div class="flex flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
        <div class="flex items-start gap-4">
          <span class="grid h-16 w-12 shrink-0 place-items-center rounded-lg shadow-sm" :class="e.locked ? 'bg-slate-100 text-slate-400' : 'bg-accent text-white'"><i data-lucide="book-open" class="h-6 w-6"></i></span>
          <div class="min-w-0 flex-1">
            <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="e.access === 'paid' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'" x-text="e.access === 'paid' ? 'Premium' : 'Free'"></span>
            <h3 class="mt-1.5 font-semibold" x-text="e.title"></h3>
            <p class="mt-1 text-sm text-slate-500" x-text="e.desc"></p>
          </div>
        </div>
        <div class="mt-auto pt-5">
          <template x-if="!e.locked">
            <div class="grid grid-cols-2 gap-2">
              <button @click="openBook(e, false)" class="flex items-center justify-center gap-2 rounded-xl bg-accent py-2.5 text-sm font-semibold text-white hover:bg-accent-dark"><i data-lucide="eye" class="h-4 w-4"></i>Read</button>
              <button @click="openBook(e, true)" class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold hover:bg-slate-50"><i data-lucide="download" class="h-4 w-4"></i>Download</button>
            </div>
          </template>
          <template x-if="e.locked">
            <a :href="joinLink('I would like to unlock the premium ebook &quot;' + e.title + '&quot;.')" target="_blank" class="flex items-center justify-center gap-2 rounded-xl border border-amber-200 bg-amber-50 py-2.5 text-sm font-semibold text-amber-800 hover:bg-amber-100"><i data-lucide="lock" class="h-4 w-4"></i>Unlock via WhatsApp</a>
          </template>
          <p class="mt-2 text-center text-xs text-slate-400" x-text="'PDF · ' + fmtSize(e.size)"></p>
        </div>
      </div>
    </template>
  </div>
  <p x-show="!list.length" class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-10 text-center text-sm text-slate-500">No ebooks for this program yet.</p>
  <p x-show="error" x-cloak class="rounded-xl bg-rose-50 p-3 text-sm text-rose-700" x-text="error"></p>
</main>

<script>
function ebooks() {
  const exam = getExam(), all = DB.ebooks.filter(e => e.exam === exam);
  return {
    E: DB.exams[exam], filter: 'all', error: '',
    count(f) { return all.filter(e => f === 'all' || e.access === f).length; },
    get list() { return all.filter(e => this.filter === 'all' || e.access === this.filter); },
    // File diambil lewat API dengan token login, lalu dibuka/diunduh dari memori browser
    async openBook(e, download) {
      this.error = '';
      const w = download ? null : window.open('', '_blank');
      try {
        const r = await fetch('/api/ebooks/' + e.id + '/file', { headers: { Authorization: 'Bearer ' + token() } });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not open the ebook');
        const url = URL.createObjectURL(await r.blob());
        if (w) { w.location = url; return; }
        const a = document.createElement('a'); a.href = url; a.download = e.title.replace(/[^\w .-]+/g, '') + '.pdf'; a.click();
      } catch (err) { w?.close(); this.error = err.message; }
    },
  };
}
</script>
</body>
</html>
