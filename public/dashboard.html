<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<body data-shell="app" data-active="dashboard" data-title="Dashboard">
<main x-data="dash()" class="space-y-6">
  <!-- Greeting -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Hi, <span x-text="DB.user.name.split(' ')[0]"></span> 👋</h2>
      <p class="mt-1 text-slate-500">You are preparing for <b class="text-accent" x-text="E.name"></b>. Stay consistent and keep going!</p>
    </div>
  </div>

  <!-- Placement test: asked first when there is no result yet -->
  <template x-if="plPkg && !pl">
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-accent to-accent-dark p-6 text-white shadow-soft sm:p-8">
      <i data-lucide="gauge" class="absolute -bottom-8 -right-8 h-48 w-48 text-white/10"></i>
      <p class="text-sm font-medium text-white/70">Step 1 · Placement Test</p>
      <h3 class="mt-1 text-2xl font-bold sm:text-3xl">Find out your level first</h3>
      <p class="mt-2 max-w-2xl text-white/85">Take a short <span x-text="E.name"></span> placement test (<span x-text="plCount"></span> questions, <span x-text="plMinutes"></span> minutes). You will get your level, an estimated score, and a class recommendation. It is free and does not use your mock test quota.</p>
      <a :href="'test.html?pkg=' + plPkg.id" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-accent hover:bg-white/90"><i data-lucide="play" class="h-4 w-4"></i>Start Test</a>
    </div>
  </template>
  <template x-if="pl">
    <div class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-soft sm:flex-row sm:items-center">
      <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-accent text-xl font-extrabold text-white" x-text="levelOf(pl.total).code"></span>
      <div class="flex-1 text-sm">
        <p class="font-semibold" x-text="'Your placement level: ' + levelOf(pl.total).code + ' (' + levelOf(pl.total).name + ')'"></p>
        <p class="text-slate-600" x-text="fmtDate(pl.date) + ' · ' + pl.total + '% correct' + (LEVEL_RANGE[exam] ? ' · estimated score ' + LEVEL_RANGE[exam][levelOf(pl.total).code] : '')"></p>
      </div>
      <div class="flex gap-2">
        <a :href="'placement.html?id=' + pl.id" class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold hover:bg-slate-50">View Result</a>
        <a :href="'test.html?pkg=' + plPkg?.id" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">Retake</a>
      </div>
    </div>
  </template>

  <!-- Stats -->
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
      <div class="flex items-center justify-between"><p class="text-sm text-slate-500">Latest mock test score</p><span class="grid h-9 w-9 place-items-center rounded-xl bg-accent-soft text-accent"><i data-lucide="award" class="h-5 w-5"></i></span></div>
      <p class="mt-3 text-3xl font-bold" x-text="lastScore"></p>
      <p class="mt-1 text-xs font-medium" :class="delta.startsWith('-') ? 'text-rose-600' : 'text-emerald-600'" x-text="delta"></p>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
      <div class="flex items-center justify-between"><p class="text-sm text-slate-500">Target score <button @click="$dispatch('open-target')" class="ml-1 text-xs font-semibold text-accent hover:underline" x-text="target == null ? 'Set' : 'Edit'"></button></p><span class="grid h-9 w-9 place-items-center rounded-xl bg-amber-50 text-amber-600"><i data-lucide="target" class="h-5 w-5"></i></span></div>
      <p x-show="target != null" class="mt-3 text-3xl font-bold" x-text="f(target)"></p>
      <button x-show="target == null" @click="$dispatch('open-target')" class="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">Set your target</button>
      <p class="mt-1 text-xs text-slate-500" x-text="gap"></p>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
      <div class="flex items-center justify-between"><p class="text-sm text-slate-500">Meetings completed</p><span class="grid h-9 w-9 place-items-center rounded-xl bg-emerald-50 text-emerald-600"><i data-lucide="book-check" class="h-5 w-5"></i></span></div>
      <p class="mt-3 text-3xl font-bold"><span x-text="chapters.filter(c => c.status === 'done').length"></span><span class="text-lg font-medium text-slate-400"> / <span x-text="chapters.length"></span></span></p>
      <p class="mt-1 text-xs text-slate-500" x-text="cont && cont.status !== 'done' ? 'Next: Meeting ' + meetingNo(cont) : 'All meetings completed 🎉'"></p>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
      <div class="flex items-center justify-between"><p class="text-sm text-slate-500">Questions answered</p><span class="grid h-9 w-9 place-items-center rounded-xl bg-violet-50 text-violet-600"><i data-lucide="list-checks" class="h-5 w-5"></i></span></div>
      <p class="mt-3 text-3xl font-bold" x-text="answered.total"></p>
      <p class="mt-1 text-xs text-slate-500" x-text="answered.total ? 'Average accuracy ' + Math.round(answered.correct / answered.total * 100) + '%' : 'From your mock tests'"></p>
    </div>
  </div>

  <div class="grid gap-6 lg:grid-cols-2">
    <!-- Progress by section -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
      <div class="flex items-center justify-between"><h3 class="font-semibold">Progress by Section</h3><a href="materi.html" class="text-sm font-medium text-accent hover:underline">Details</a></div>
      <div class="mt-5 space-y-5">
        <template x-for="s in sections" :key="s.id">
          <div>
            <div class="mb-2 flex items-center justify-between text-sm">
              <span class="flex items-center gap-2 font-medium"><i :data-lucide="s.icon" class="h-4 w-4 text-slate-400"></i><span x-text="s.short"></span></span>
              <span class="whitespace-nowrap text-xs text-slate-500"><b class="text-slate-900" x-text="s.progress + '%'"></b> · <span x-text="s.done + '/' + s.total + ' meetings'"></span></span>
            </div>
            <div class="h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-accent transition-all duration-700" :style="'width:' + s.progress + '%'"></div></div>
          </div>
        </template>
      </div>
    </div>
    <!-- Latest mock test (only when there is one) -->
    <template x-if="att"><div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
      <div class="flex items-center justify-between"><h3 class="font-semibold">Latest Mock Test</h3><span class="text-xs text-slate-400" x-text="fmtDate(att.date)"></span></div>
      <p class="mt-1 text-sm text-slate-500" x-text="res.pkg.name"></p>
      <div class="mt-4 space-y-3">
        <template x-for="s in res.sections" :key="s.id">
          <div class="flex items-center gap-3 rounded-xl bg-slate-50 p-3">
            <span class="grid h-9 w-9 place-items-center rounded-lg bg-white text-slate-500 shadow-sm"><i :data-lucide="s.meta.icon" class="h-4 w-4"></i></span>
            <div class="min-w-0 flex-1"><p class="truncate text-sm font-medium" x-text="s.meta.short"></p><p class="text-xs text-slate-500" x-text="sectionDetail(s)"></p></div>
            <span class="text-lg font-bold" x-text="s.score == null ? 'Tutor' : f(s.score)"></span>
          </div>
        </template>
      </div>
      <a :href="'hasil.html?id=' + att.id" class="mt-4 flex items-center justify-center gap-2 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold transition hover:bg-slate-50">View Full Result <i data-lucide="arrow-right" class="h-4 w-4"></i></a>
    </div></template>
    <!-- Activity -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft" :class="att && 'lg:col-span-2'">
      <h3 class="font-semibold">Recent Activity</h3>
      <ol class="mt-4 space-y-4">
        <template x-for="a in activity">
          <li class="flex gap-3">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-slate-100 text-slate-500"><i :data-lucide="a.icon" class="h-4 w-4"></i></span>
            <div class="flex-1 text-sm"><p x-html="a.text"></p><p class="text-xs text-slate-400" x-text="ago(a.at)"></p></div>
          </li>
        </template>
      </ol>
      <p x-show="!activity.length" class="mt-4 rounded-xl bg-slate-50 p-4 text-sm text-slate-500">No activity yet. Start with the first meeting in Lessons.</p>
    </div>
  </div>
</main>

<script>
function dash() {
  const exam = getExam(), E = DB.exams[exam], f = v => v == null ? '—' : exam === 'ielts' ? Number(v).toFixed(1) : v;
  const isFull = a => DB.packages.find(p => p.id === a.pkg)?.type === 'full';
  // Prefer the latest Full Test (has a total score); otherwise the latest section test
  const att = findAttempt(a => a.exam === exam && isFull(a)) || findAttempt(a => a.exam === exam);
  const res = att && scoreAttempt(att), last = att && attemptScore(att);
  const prevAtt = att && DB.attempts.find(a => a !== att && a.exam === exam && a.pkg === att.pkg);
  const prev = prevAtt && attemptScore(prevAtt), target = DB.user.target[exam];
  const chapters = DB.chapters.filter(c => c.exam === exam && !c.draft);
  const answered = DB.attempts.filter(a => a.exam === exam && !isPlacement(a)).flatMap(a => a.sections).reduce((t, s) => ({ correct: t.correct + (s.correct || 0), total: t.total + (s.total || 0) }), { correct: 0, total: 0 });
  const plPkg = DB.packages.find(p => p.exam === exam && p.type === 'placement');
  return {
    exam, E, att, res, chapters, answered, target, f, plPkg,
    pl: DB.attempts.find(a => a.exam === exam && isPlacement(a)),
    plCount: plPkg ? plPkg.sections.reduce((n, [s]) => n + sectionItems(exam, s, 'placement').length, 0) : 0,
    plMinutes: plPkg ? plPkg.sections.reduce((n, s) => n + s[1], 0) : 0,
    activity: DB.activity.filter(a => a.exam === exam).slice(0, 5),
    cont: chapters.find(c => c.status !== 'done') || chapters.at(-1),
    sections: E.sections.map(s => {
      const cs = chapters.filter(c => c.section === s.id);
      return { ...s, total: cs.length, done: cs.filter(c => c.status === 'done').length, progress: Math.round(cs.reduce((a, c) => a + c.progress, 0) / (cs.length || 1)) };
    }),
    lastScore: f(last),
    delta: last == null ? 'No mock test yet' : prev == null ? 'First mock test' : (last >= prev ? '+' : '') + f(+(last - prev).toFixed(1)) + ' from previous test',
    gap: target == null ? 'What score do you need?' : last == null ? 'Take a mock test to see where you stand' : last >= target ? 'Target reached 🎉' : f(+(target - last).toFixed(1)) + ' to go',
  };
}
</script>
</body>
</html>
