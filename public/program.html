<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About the Program — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<body data-shell="app" data-active="program" data-title="About the Program">
<!-- Program mengikuti pilihan di kanan atas (getExam). ?p=kode hanya untuk pratinjau admin. -->
<main x-data="program()" class="space-y-6">
  <!-- Program summary -->
  <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-accent to-accent-dark p-6 text-white shadow-soft sm:p-8">
    <i data-lucide="graduation-cap" class="absolute -bottom-8 -right-8 h-48 w-48 text-white/10"></i>
    <p class="text-sm font-medium text-white/70">About the program</p>
    <h2 class="mt-1 text-2xl font-bold sm:text-3xl" x-text="E.full || E.name"></h2>
    <div class="mt-5 flex flex-wrap gap-2 text-xs">
      <span class="flex items-center gap-1.5 rounded-lg bg-white/15 px-2.5 py-1.5"><i data-lucide="layout-grid" class="h-3.5 w-3.5"></i><span x-text="E.sections.length + (E.sections.length === 1 ? ' section' : ' sections')"></span></span>
      <span x-show="E.scale" class="flex items-center gap-1.5 rounded-lg bg-white/15 px-2.5 py-1.5"><i data-lucide="award" class="h-3.5 w-3.5"></i><span x-text="'Score ' + E.scale"></span></span>
      <span x-show="!E.active" class="rounded-lg bg-white/25 px-2.5 py-1.5 font-semibold">Coming soon</span>
    </div>
  </div>

  <!-- Alur belajar sesuai program siswa (20 / 30 / 40 pertemuan) -->
  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft sm:p-6">
    <h3 class="font-semibold">Your learning path</h3>
    <ol class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <template x-for="(s, i) in steps" :key="i">
        <li>
          <a :href="s.locked ? null : s.href" :target="s.external ? '_blank' : null" class="flex h-full items-center gap-3 rounded-xl border p-4 transition" :class="s.locked ? 'cursor-not-allowed border-slate-100 bg-slate-50 text-slate-400' : 'border-slate-200 hover:border-accent/50 hover:bg-accent-soft/50'">
            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-sm font-bold" :class="s.done ? 'bg-accent text-white' : s.locked ? 'bg-slate-200 text-slate-400' : 'bg-accent-soft text-accent'" x-html="s.done ? ico('check') : s.locked ? ico('lock') : i + 1"></span>
            <span class="min-w-0 text-sm"><span class="block font-semibold" :class="!s.locked && 'text-slate-900'" x-text="s.title"></span><span class="block text-xs" :class="!s.locked && 'text-slate-500'" x-text="s.note"></span></span>
          </a>
        </li>
      </template>
    </ol>
  </div>

  <div class="grid gap-6 lg:grid-cols-3">
    <div class="min-w-0 space-y-6 lg:col-span-2">
      <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8">
        <h3 class="text-lg font-bold">What is <span x-text="E.name"></span>?</h3>
        <div class="content mt-2" x-html="E.about || '<p>No description yet.</p>'"></div>
      </article>

      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft">
        <div class="p-5"><h3 class="font-semibold">What is tested</h3><p class="text-sm text-slate-500">Official test format by section.</p></div>
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="bg-slate-50 text-left text-xs uppercase tracking-wider text-slate-500"><tr><th class="px-5 py-3">Section</th><th class="px-5 py-3">Questions & time</th><th class="px-5 py-3">Scoring on the platform</th></tr></thead>
          <tbody class="divide-y divide-slate-100">
            <template x-for="s in E.sections" :key="s.id">
              <tr><td class="px-5 py-3 font-medium"><span class="flex items-center gap-2"><span class="text-accent" x-html="ico(s.icon)"></span><span x-text="s.name"></span></span></td>
                <td class="whitespace-nowrap px-5 py-3 text-slate-600" x-text="s.official || '—'"></td>
                <td class="px-5 py-3"><a x-show="s.office" :href="officeLink(E, s)" target="_blank" class="text-xs font-semibold text-emerald-700 hover:underline">At our office, via WhatsApp</a><span x-show="!s.office" class="rounded-md px-2 py-0.5 text-xs font-semibold" :class="s.tutor ? 'bg-violet-100 text-violet-700' : 'bg-emerald-50 text-emerald-700'" x-text="s.tutor ? 'Graded by tutor' : 'Automatic'"></span></td></tr>
            </template>
          </tbody>
        </table></div>
      </div>

      <div x-show="E.rules.length" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
        <h3 class="font-semibold">Mock test rules</h3>
        <ul class="mt-3 space-y-2 text-sm text-slate-600"><template x-for="r in E.rules"><li class="flex gap-2"><i data-lucide="check-circle" class="mt-0.5 h-4 w-4 shrink-0 text-emerald-500"></i><span x-html="r"></span></li></template></ul>
      </div>
    </div>

    <!-- Next steps -->
    <aside class="space-y-4 lg:sticky lg:top-24 lg:self-start">
      <!-- Latest placement result -->
      <template x-if="pl">
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
          <div class="flex items-center justify-between"><h3 class="font-semibold">Your placement result</h3><span class="text-xs text-slate-400" x-text="fmtDate(pl.date)"></span></div>
          <div class="mt-4 flex items-center gap-4">
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-accent text-xl font-extrabold text-white" x-text="level.code"></span>
            <div class="text-sm"><p class="font-semibold" x-text="level.name"></p><p class="text-slate-500" x-text="pl.total + '% correct'"></p>
              <p x-show="rangeOf(E.key, level.code)" class="text-slate-500" x-text="'Est. score ' + rangeOf(E.key, level.code)"></p></div>
          </div>
          <template x-for="s in pl.sections" :key="s.id">
            <div class="mt-3 flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2 text-sm"><span x-text="sectionMeta(E.key, s.id)?.short || s.id"></span><b x-text="s.correct + ' / ' + s.total"></b></div>
          </template>
          <p x-show="track" class="mt-3 rounded-xl bg-accent-soft p-3 text-sm text-slate-800"><b x-text="track?.name"></b><span x-show="track?.target" x-text="' · target ' + track?.target"></span></p>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <a :href="'placement.html?id=' + pl.id" class="rounded-xl border border-slate-200 py-2 text-center text-xs font-semibold hover:bg-slate-50">Details</a>
            <a :href="'test.html?pkg=' + plPkg?.id" class="rounded-xl border border-slate-200 py-2 text-center text-xs font-semibold hover:bg-slate-50">Retake</a>
          </div>
        </div>
      </template>

      <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-6">
        <h3 class="font-semibold text-emerald-900">Want to learn with a tutor?</h3>
        <p class="mt-1 text-sm text-emerald-800" x-text="'Join the ' + E.name + ' class at ' + DB.contact.name + '.'"></p>
        <a :href="joinLink(pl ? 'My ' + E.name + ' placement result: level ' + level.code + ' (' + pl.total + '% correct). I would like to join the ' + E.name + ' program.' : 'I would like to join the ' + E.name + ' program.')" target="_blank" class="mt-4 flex items-center justify-center gap-2 rounded-xl bg-emerald-600 py-3 text-sm font-semibold text-white hover:bg-emerald-700"><i data-lucide="message-circle" class="h-4 w-4"></i>Join EnglishOn</a>
        <a x-show="DB.contact.instagram" :href="DB.contact.instagram" target="_blank" rel="noopener" class="mt-2 flex items-center justify-center gap-2 rounded-xl border border-emerald-300 bg-white py-3 text-sm font-semibold text-emerald-800 hover:bg-emerald-100"><i data-lucide="instagram" class="h-4 w-4"></i>Follow us on Instagram</a>
        <p class="mt-3 text-xs text-emerald-800/80"><b class="block" x-text="DB.contact.name"></b><span class="block" x-text="DB.contact.address"></span><span x-text="DB.contact.hours"></span></p>
      </div>
    </aside>
  </div>
</main>

<script>
function program() {
  const key = DB.exams[qs('p')] ? qs('p') : getExam(), E = DB.exams[key];
  document.documentElement.dataset.exam = key;
  const pl = DB.attempts.find(a => a.exam === key && isPlacement(a)) || null;
  const plPkg = DB.packages.find(p => p.exam === key && p.type === 'placement');
  const pending = DB.pendingPlacements?.some(a => a.exam === key);
  // Placement → Program N pertemuan (ditentukan saat daftar di kantor) → Study the lessons → Mock test
  const steps = [
    { title: 'Placement Test', note: pl ? 'Level ' + plLevel(pl).code : pending ? 'Result being reviewed' : 'Check your level, free', href: pl ? 'placement.html?id=' + pl.id : 'placement.html', done: !!pl || pending, locked: !access.can('placement') || !plPkg },
    access.program
      ? { title: 'Program ' + access.program + ' Meetings', note: access.inactive ? 'Program ended' : 'Your enrolled program', href: 'materi.html', done: true }
      : { title: access.full ? 'Your Program' : 'Join a Program', note: access.full ? 'Full access' : '20, 30 or 40 meetings at our office', href: joinLink('I would like to join the ' + E.name + ' program (20, 30 or 40 meetings).'), external: !access.full, done: access.full },
    { title: 'Study the Lessons', note: access.program ? access.program + ' meetings in Curriculum' : 'Curriculum & skills practice', href: 'materi.html', locked: !access.can('materi') },
    { title: 'Take a Mock Test', note: 'Real exam conditions', href: 'simulasi.html', locked: !access.can('simulasi') },
  ];
  return { E, pl, steps, level: pl && plLevel(pl), track: trackOf(key), plPkg };
}
</script>
</body>
</html>
