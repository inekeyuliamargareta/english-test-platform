<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Test — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<!-- Tidak ada di menu: dibuka dari Dashboard, About the Program, dan Results. Program = pilihan di kanan atas. -->
<body data-shell="app" data-active="dashboard" data-title="Placement Test">
<main x-data="placement()" class="space-y-6">

  <!-- ===== Result ===== -->
  <template x-if="att">
    <div class="space-y-6">
      <a href="hasil.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-900"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back to results</a>
      <div class="grid gap-6 lg:grid-cols-3">
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-accent to-accent-dark p-6 text-white shadow-soft sm:p-8 lg:col-span-2">
          <i data-lucide="gauge" class="absolute -bottom-8 -right-8 h-48 w-48 text-white/10"></i>
          <p class="text-sm font-medium text-white/70" x-text="pkg.name + ' · ' + fmtDate(att.date, 'long')"></p>
          <div class="mt-4 flex items-center gap-5">
            <div class="grid h-24 w-24 shrink-0 place-items-center rounded-2xl bg-white text-4xl font-extrabold text-accent" x-text="level.code"></div>
            <div>
              <h2 class="text-2xl font-bold sm:text-3xl" x-text="level.name + ' level'"></h2>
              <p class="mt-1 text-white/85" x-text="correct + ' of ' + total + ' correct (' + att.total + '%)'"></p>
              <p x-show="range" class="mt-1 text-sm text-white/85">Estimated <span x-text="E.name"></span> score: <b x-text="range"></b></p>
            </div>
          </div>
          <div class="mt-6 grid grid-cols-5 gap-1.5 text-center text-xs">
            <template x-for="l in levelsOf(att.exam)" :key="l.code">
              <div class="rounded-lg px-2 py-2" :class="l.code === level.code ? 'bg-white font-bold text-accent' : 'bg-white/15 text-white/80'"><p x-text="l.code"></p><p class="hidden sm:block" x-text="l.name"></p><p class="opacity-80" x-text="l.min + '%+'"></p></div>
            </template>
          </div>
          <p class="mt-4 text-xs text-white/70">This is an estimate from a short test, not an official score. Take a full mock test for a complete picture.</p>
        </div>

        <div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
          <h3 class="font-semibold">Your learning track</h3>
          <div class="rounded-xl bg-accent-soft p-4 text-sm text-slate-800">
            <p class="font-bold text-accent" x-text="track.name"></p>
            <p x-show="track.target" class="text-xs text-slate-600" x-text="'Target score: ' + track.target"></p>
            <ul x-show="track.points.length" class="mt-2 list-disc space-y-0.5 pl-4 text-slate-700"><template x-for="p in track.points"><li x-text="p"></li></template></ul>
          </div>
          <a href="materi.html" class="flex items-center gap-3 rounded-xl bg-accent px-4 py-3 text-sm font-semibold text-white hover:bg-accent-dark"><i data-lucide="book-open" class="h-5 w-5"></i>Open your curriculum<i data-lucide="arrow-right" class="ml-auto h-4 w-4"></i></a>
          <a :href="joinLink('My ' + pkg.name + ' result: level ' + level.code + ' (' + level.name + '), ' + att.total + '% correct. I would like to join the ' + track.name + '.')" target="_blank"
            class="flex items-center justify-center gap-2 rounded-xl bg-emerald-600 py-3 text-sm font-semibold text-white hover:bg-emerald-700"><i data-lucide="message-circle" class="h-4 w-4"></i>Join EnglishOn</a>
          <a :href="'review.html?id=' + att.id" class="flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold hover:bg-slate-50"><i data-lucide="list-checks" class="h-5 w-5 text-slate-500"></i>Review answers</a>
          <a :href="'test.html?pkg=' + pkg.id" class="flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold hover:bg-slate-50"><i data-lucide="rotate-ccw" class="h-5 w-5 text-slate-500"></i>Retake placement test</a>
          <a href="program.html" class="mt-auto text-center text-sm font-medium text-slate-500 hover:text-slate-900" x-text="'About ' + E.name"></a>
        </div>
      </div>

      <!-- How the level is calculated -->
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
        <h3 class="flex items-center gap-2 font-semibold"><i data-lucide="info" class="h-5 w-5 text-accent"></i>How your level is calculated</h3>
        <ol class="mt-3 space-y-1.5 text-sm text-slate-600">
          <li><b>1.</b> You answered <b x-text="correct"></b> of <b x-text="total"></b> questions correctly, which is <b x-text="att.total + '%'"></b>.</li>
          <li><b>2.</b> Your percentage is matched to a CEFR level using the table below. You reached <b x-text="level.code + ' (' + level.name + ')'"></b>.</li>
          <li x-show="range"><b>3.</b> Each level matches an estimated <span x-text="E.name"></span> score. <span x-text="LEVEL_SOURCE[att.exam] || ''"></span></li>
        </ol>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-xs uppercase tracking-wider text-slate-400"><tr><th class="py-2 pr-4">Level</th><th class="py-2 pr-4">Correct answers</th><th x-show="range" class="py-2">Estimated score</th></tr></thead>
            <tbody>
              <template x-for="(l, i) in levelsOf(att.exam)" :key="l.code">
                <tr class="border-t border-slate-100" :class="l.code === level.code && 'bg-accent-soft font-semibold text-accent'">
                  <td class="py-2 pl-2 pr-4" x-text="l.code + ' · ' + l.name"></td>
                  <td class="py-2 pr-4" x-text="levelsOf(att.exam)[i + 1] ? l.min + '–' + (levelsOf(att.exam)[i + 1].min - 1) + '%' : l.min + '–100%'"></td>
                  <td x-show="range" class="py-2" x-text="l.range"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== Start (program selected at the top right) ===== -->
  <template x-if="!att">
    <div class="mx-auto max-w-2xl">
      <div x-show="!pkg" class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-10 text-center text-sm text-slate-500">There is no placement test for this program yet.</div>
      <template x-if="pkg">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 text-center shadow-soft sm:p-10">
          <span class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-accent-soft text-accent"><i data-lucide="gauge" class="h-8 w-8"></i></span>
          <h2 class="mt-5 text-2xl font-bold" x-text="pkg.name"></h2>
          <p class="mt-2 text-slate-500">A short test from easy to hard. You will get your level (A1–C1), an estimated score, and your learning track. Your level is decided by the percentage of correct answers. It is free and does not use your mock test quota.</p>
          <div class="mt-5 flex justify-center gap-3 text-sm">
            <span class="flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2"><i data-lucide="file-question" class="h-4 w-4 text-slate-500"></i><span x-text="count + ' questions'"></span></span>
            <span class="flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2"><i data-lucide="clock" class="h-4 w-4 text-slate-500"></i><span x-text="minutes + ' minutes'"></span></span>
          </div>
          <a :href="count ? 'test.html?pkg=' + pkg.id : null" class="mt-8 inline-flex w-full items-center justify-center gap-2 rounded-xl py-3.5 font-semibold sm:w-auto sm:px-10" :class="count ? 'bg-accent text-white hover:bg-accent-dark' : 'cursor-not-allowed bg-slate-100 text-slate-400'">
            <i data-lucide="play" class="h-4 w-4"></i><span x-text="count ? (last ? 'Retake Test' : 'Start Test') : 'No questions yet'"></span></a>
          <a x-show="last" :href="'placement.html?id=' + last?.id" class="mt-4 block text-sm font-medium text-accent hover:underline" x-text="last ? 'Latest result: level ' + levelOf(last.total, last.exam).code + ' · ' + last.total + '%' : ''"></a>
        </div>
      </template>
    </div>
  </template>
</main>

<script>
function placement() {
  const att = DB.attempts.find(a => a.id === +qs('id') && isPlacement(a)) || null;
  if (!att) {
    const exam = getExam(), pkg = DB.packages.find(p => p.exam === exam && p.type === 'placement') || null;
    return { att, pkg, LEVELS,
      count: pkg ? pkg.sections.reduce((n, [s]) => n + sectionItems(exam, s, 'placement').length, 0) : 0,
      minutes: pkg ? pkg.sections.reduce((n, s) => n + s[1], 0) : 0,
      last: pkg && DB.attempts.find(a => a.pkg === pkg.id) };
  }
  document.documentElement.dataset.exam = att.exam;
  const E = DB.exams[att.exam], level = levelOf(att.total, att.exam);
  return { att, E, level, LEVELS, pkg: DB.packages.find(p => p.id === att.pkg),
    correct: att.sections.reduce((n, s) => n + (s.correct || 0), 0), total: att.sections.reduce((n, s) => n + (s.total || 0), 0),
    range: rangeOf(att.exam, level.code),
    track: trackOf(att.exam) || { name: level.name, target: '', points: [] },
  };
}
</script>
</body>
</html>
