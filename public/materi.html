<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<!-- Pertemuan terbuka berurutan: Meeting N bisa dimulai setelah Meeting N-1 selesai 100% -->
<body data-shell="app" data-active="materi" data-title="Curriculum">
<main x-data="curriculum()" class="mx-auto max-w-4xl space-y-5">
  <!-- Title -->
  <div class="text-center">
    <h2 class="text-3xl font-extrabold tracking-tight text-accent" x-text="'Program ' + E.name"></h2>
    <div class="mt-2 flex flex-wrap items-center justify-center gap-2 text-sm text-slate-500">
      <span x-show="track" class="rounded-full bg-accent px-3 py-0.5 text-xs font-semibold text-white" x-text="track?.name"></span>
      <span x-show="track && diag">·</span>
      <span x-show="diag" x-text="'Diagnostic score: ' + (diag?.total ?? diag?.range ?? '—')"></span>
    </div>
    <p x-show="track" class="mt-1 text-sm text-slate-500" x-text="(track?.target ? 'Target score: ' + track.target : '') + (track?.points[0] ? ' · ' + track.points[0] : '')"></p>
  </div>

  <!-- Track -->
  <template x-if="track">
    <div class="rounded-2xl border-2 border-accent/40 bg-accent-soft p-5">
      <h3 class="flex items-center gap-2 text-lg font-bold text-accent"><i data-lucide="graduation-cap" class="h-5 w-5"></i><span x-text="track.name"></span></h3>
      <p x-show="track.target" class="text-xs text-slate-500" x-text="'Target score: ' + track.target"></p>
      <div x-show="track.points.length" class="mt-3 text-sm text-slate-700">
        <p class="font-semibold">This track is for:</p>
        <ul class="mt-1 space-y-0.5"><template x-for="p in track.points"><li x-text="'• ' + p"></li></template></ul>
      </div>
    </div>
  </template>
  <div x-show="!track && plPkg" class="flex flex-col gap-3 rounded-2xl border-2 border-dashed border-accent/40 bg-white p-5 sm:flex-row sm:items-center">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-soft text-accent"><i data-lucide="gauge" class="h-5 w-5"></i></span>
    <p class="flex-1 text-sm"><b>Find your learning track.</b> <span class="text-slate-500">Take the short placement test to get your track and target score.</span></p>
    <a :href="'test.html?pkg=' + plPkg?.id" class="rounded-xl bg-accent px-4 py-2 text-center text-sm font-semibold text-white hover:bg-accent-dark">Start Placement Test</a>
  </div>

  <!-- Overall progress -->
  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
    <div class="flex items-center justify-between text-sm"><h3 class="font-semibold">Overall Progress</h3><span class="text-slate-500" x-text="done + ' / ' + all.length + ' meetings completed'"></span></div>
    <div class="mt-3 h-2.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-accent transition-all" :style="'width:' + pct + '%'"></div></div>
    <p class="mt-1.5 text-xs text-slate-500" x-text="pct + '% complete'"></p>
  </div>

  <!-- Section scores -->
  <div>
    <div class="grid grid-cols-2 gap-3" :class="scored.length >= 3 ? 'md:grid-cols-4' : 'md:grid-cols-3'">
      <template x-for="(s, i) in scored" :key="s.id">
        <div class="rounded-2xl border p-4 text-center" :class="COLORS[i % COLORS.length]">
          <p class="text-sm font-semibold" x-text="s.short"></p>
          <p class="mt-1 text-2xl font-extrabold" x-text="fmt1(diag?.sections[s.id])"></p>
          <p class="text-xs opacity-70" x-text="s.tutor ? 'tutor graded' : E.key === 'toefl' ? '/' + (TOEFL_MAX[s.id] || 67) : E.key === 'ielts' ? '/9' : '/100'"></p>
        </div>
      </template>
      <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-center text-amber-700">
        <p class="text-sm font-semibold">Total Score</p>
        <p class="mt-1 text-2xl font-extrabold" x-text="diag?.total != null ? fmt1(diag.total) : diag?.range ? '~' : '—'"></p>
        <p class="text-xs opacity-70" x-text="diag?.total != null ? (E.scale ? '/' + E.scale.split(/[–-]/).pop().trim() : '') : diag?.range || ''"></p>
      </div>
    </div>
    <p class="mt-2 text-center text-xs text-slate-400" x-text="diag ? 'From: ' + diag.source + ' · ' + fmtDate(diag.date) : 'Take the placement test or a full mock test to see your scores.'"></p>
  </div>

  <!-- Locked notice (redirect from a locked meeting) -->
  <div x-show="lockedMsg" x-cloak class="flex items-center gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800"><i data-lucide="lock" class="h-5 w-5 shrink-0"></i><span x-text="lockedMsg"></span></div>

  <!-- Meetings -->
  <ol class="space-y-2.5">
    <template x-for="c in all" :key="c.id">
      <li class="flex items-center gap-4 rounded-2xl border bg-white p-4 shadow-soft transition" :class="c.locked ? 'border-slate-100 opacity-50 shadow-none' : c.status === 'done' ? 'border-accent/30 bg-accent-soft/50' : 'border-slate-200'">
        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full border-2 text-base font-bold" :class="c.status === 'done' ? 'border-accent bg-accent text-white' : c.locked ? 'border-slate-200 text-slate-400' : 'border-accent text-accent'" x-html="c.status === 'done' ? ico('check', 'h-5 w-5') : c.no"></span>
        <div class="min-w-0 flex-1">
          <p class="truncate font-semibold" :class="c.locked && 'text-slate-500'" x-text="c.title"></p>
          <p class="flex flex-wrap items-center gap-x-3 text-xs text-slate-500"><span class="truncate" x-text="c.desc"></span><span class="flex items-center gap-1 whitespace-nowrap"><i data-lucide="clock" class="h-3 w-3"></i><span x-text="c.minutes + ' min'"></span></span>
            <span x-show="c.status === 'progress'" class="whitespace-nowrap font-semibold text-accent" x-text="c.progress + '% done'"></span></p>
        </div>
        <template x-if="c.locked"><span class="flex shrink-0 items-center gap-1.5 text-xs font-medium text-slate-400"><i data-lucide="lock" class="h-4 w-4"></i>Locked</span></template>
        <template x-if="!c.locked">
          <div class="flex shrink-0 items-center gap-2">
            <a :href="'materi-detail.html?id=' + c.id" class="rounded-lg border-2 border-accent px-3 py-1 text-xs font-semibold text-accent transition hover:bg-accent hover:text-white" x-text="c.status === 'done' ? 'Review' : c.status === 'progress' ? 'Continue' : 'Start'"></a>
            <span :class="c.status === 'done' ? 'text-accent' : 'text-emerald-500'" x-html="ico(c.status === 'done' ? 'circle-check' : 'lock-open', 'h-4 w-4')"></span>
          </div>
        </template>
      </li>
    </template>
  </ol>
  <p x-show="!all.length" class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-10 text-center text-sm text-slate-500">The curriculum for this program is not available yet.</p>
</main>

<script>
function curriculum() {
  const exam = getExam(), E = DB.exams[exam];
  // Meeting N terbuka jika Meeting N-1 sudah 100%
  const all = meetings(exam).map((c, i, list) => ({ ...c, no: i + 1, locked: i > 0 && list[i - 1].progress < 100 }));
  const done = all.filter(c => c.status === 'done').length;
  const lockedC = all.find(c => c.id === qs('locked'));
  return {
    E, all, done, scored: E.sections.filter(s => !s.office), pct: all.length ? Math.round(done / all.length * 100) : 0,
    track: trackOf(exam), diag: diagnostic(exam),
    plPkg: DB.packages.find(p => p.exam === exam && p.type === 'placement'),
    lockedMsg: lockedC ? `Meeting ${lockedC.no} is locked. Complete Meeting ${lockedC.no - 1} first (read all parts and answer all practice questions).` : '',
    COLORS: ['border-blue-200 bg-blue-50 text-blue-700', 'border-violet-200 bg-violet-50 text-violet-700', 'border-emerald-200 bg-emerald-50 text-emerald-700', 'border-rose-200 bg-rose-50 text-rose-700'],
    fmt1: v => v == null ? '—' : exam === 'ielts' ? Number(v).toFixed(1) : v,
  };
}
</script>
</body>
</html>
