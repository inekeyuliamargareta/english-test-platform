<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<body data-shell="app" data-active="hasil" data-title="Results & Review">
<main x-data="hasil()" class="space-y-6">

  <!-- Placement test -->
  <template x-if="pl">
    <div class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-soft sm:flex-row sm:items-center">
      <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-accent text-xl font-extrabold text-white" x-text="plLevel(pl).code"></span>
      <div class="flex-1 text-sm">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Placement Test</p>
        <p class="font-semibold" x-text="'Level ' + plLevel(pl).code + ' (' + plLevel(pl).name + ') · ' + pl.total + '% correct'"></p>
        <p class="text-slate-500" x-text="fmtDate(pl.date) + (rangeOf(exam, plLevel(pl).code) ? ' · estimated score ' + rangeOf(exam, plLevel(pl).code) : '')"></p>
      </div>
      <div class="flex gap-2">
        <a :href="'placement.html?id=' + pl.id" class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold hover:bg-slate-50">View Result</a>
        <a :href="'review.html?id=' + pl.id" class="rounded-xl bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">Review Answers</a>
      </div>
    </div>
  </template>
  <div x-show="!pl && plPkg" class="flex flex-col gap-4 rounded-2xl border border-dashed border-slate-300 bg-white p-5 sm:flex-row sm:items-center">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-soft text-accent"><i data-lucide="gauge" class="h-5 w-5"></i></span>
    <p class="flex-1 text-sm"><b>No placement test yet.</b> <span class="text-slate-500">Find out your level in a few minutes.</span></p>
    <a :href="'test.html?pkg=' + plPkg?.id" class="rounded-xl bg-accent px-4 py-2 text-xs font-semibold text-white hover:bg-accent-dark">Start Test</a>
  </div>

  <!-- Mock test -->
  <div x-show="!att" class="flex flex-col items-center rounded-2xl border-2 border-dashed border-slate-200 bg-white px-6 py-12 text-center">
    <span class="grid h-14 w-14 place-items-center rounded-2xl bg-accent-soft text-accent"><i data-lucide="bar-chart-3" class="h-7 w-7"></i></span>
    <h2 class="mt-4 text-lg font-semibold">No mock test result yet</h2>
    <p class="mt-1 max-w-sm text-sm text-slate-500">Your score and answer explanations will appear here after you take a mock test.</p>
    <a href="simulasi.html" class="mt-5 rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:bg-accent-dark">Start Mock Test</a>
  </div>
  <template x-if="att"><div class="space-y-6">
    <div class="grid gap-6 lg:grid-cols-3">
      <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-accent to-accent-dark p-6 text-white shadow-soft sm:p-8 lg:col-span-2">
        <i data-lucide="award" class="absolute -bottom-8 -right-8 h-48 w-48 text-white/10"></i>
        <div class="relative flex flex-col gap-6 sm:flex-row sm:items-center">
          <div class="relative mx-auto h-40 w-40 shrink-0 sm:mx-0">
            <svg viewBox="0 0 120 120" class="h-full w-full -rotate-90"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/>
              <circle cx="60" cy="60" r="52" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" :stroke-dasharray="326.7" :stroke-dashoffset="326.7 * (1 - pct)" style="transition: stroke-dashoffset 1.2s ease"/></svg>
            <div class="absolute inset-0 grid place-items-center text-center"><div><p class="text-4xl font-extrabold" x-text="main"></p><p class="text-xs text-white/70" x-text="scale"></p></div></div>
          </div>
          <div class="text-center sm:text-left">
            <p class="text-sm font-medium text-white/70" x-text="res.pkg.name"></p>
            <h2 class="mt-1 text-2xl font-bold sm:text-3xl" x-text="res.total !== null ? (exam==='ielts' ? 'Overall Band ' + main : 'Total Score ' + main) : res.sections[0].meta.short + ': ' + main"></h2>
            <p class="mt-2 text-white/80"><span x-show="cefr !== '—'">CEFR equivalent <b x-text="cefr"></b> · </span><span x-text="targetText"></span></p>
            <p x-show="pending && res.total !== null" class="mt-1 text-xs text-white/70">Provisional overall from Listening & Reading. Writing is graded by a tutor.</p>
            <div class="mt-4 flex flex-wrap justify-center gap-2 text-xs sm:justify-start">
              <span class="flex items-center gap-1.5 rounded-lg bg-white/15 px-2.5 py-1.5"><i data-lucide="calendar" class="h-3.5 w-3.5"></i><span x-text="fmtDate(att.date, 'long')"></span></span>
              <span class="flex items-center gap-1.5 rounded-lg bg-white/15 px-2.5 py-1.5"><i data-lucide="clock" class="h-3.5 w-3.5"></i><span x-text="Math.max(1, Math.round(att.duration / 60)) + ' min taken'"></span></span>
            </div>
          </div>
        </div>
      </div>
      <div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
        <h3 class="font-semibold">Next steps</h3>
        <a :href="'review.html?id=' + att.id" class="flex items-center gap-3 rounded-xl bg-accent px-4 py-3 text-sm font-semibold text-white transition hover:bg-accent-dark"><i data-lucide="list-checks" class="h-5 w-5"></i>Review & Explanations<i data-lucide="arrow-right" class="ml-auto h-4 w-4"></i></a>
        <a :href="'review.html?filter=wrong&id=' + att.id" class="flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold transition hover:bg-slate-50"><i data-lucide="circle-x" class="h-5 w-5 text-rose-500"></i>See wrong answers <span class="ml-auto rounded-md bg-rose-50 px-2 text-xs text-rose-600" x-text="wrongCount"></span></a>
        <a x-show="!access.locked" :href="'test.html?pkg=' + res.pkg.id" class="flex items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold transition hover:bg-slate-50"><i data-lucide="rotate-ccw" class="h-5 w-5 text-slate-500"></i>Retake this test</a>
        <a x-show="access.locked" :href="joinLink('I would like to unlock more mock tests.')" target="_blank" class="flex items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-800 transition hover:bg-amber-100"><i data-lucide="lock" class="h-5 w-5"></i><span>Next mock test is locked<span class="block text-xs font-normal">Contact EnglishOn to unlock</span></span></a>
        <a href="dashboard.html" class="mt-auto text-center text-sm font-medium text-slate-500 hover:text-slate-900">Back to Dashboard</a>
      </div>
    </div>

    <div>
      <h3 class="mb-3 font-semibold">Score by Section</h3>
      <div class="grid gap-4 sm:grid-cols-2" :class="res.sections.length > 3 ? 'xl:grid-cols-4' : 'xl:grid-cols-3'">
        <template x-for="s in res.sections" :key="s.id">
          <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
            <div class="flex items-center gap-3">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-accent-soft text-accent"><i :data-lucide="s.meta.icon" class="h-5 w-5"></i></span>
              <div class="min-w-0"><p class="truncate text-sm font-semibold" x-text="s.meta.name"></p><p class="text-xs text-slate-500" x-text="exam==='ielts' ? 'Band 1–9' : 'Scale 31–' + (TOEFL_MAX[s.id] || 67)"></p></div>
            </div>
            <template x-if="!s.pending"><div>
              <p class="mt-4 text-4xl font-extrabold tracking-tight" x-text="fmtScore(s.score)"></p>
              <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-accent" :style="'width:' + secPct(s) + '%'"></div></div>
            </div></template>
            <template x-if="s.pending"><p class="mt-4 flex items-center gap-2 text-lg font-bold text-amber-600"><i data-lucide="hourglass" class="h-5 w-5"></i>Graded by tutor</p></template>
            <p class="mt-2 text-xs text-slate-500" x-text="sectionDetail(s)"></p>
          </div>
        </template>
      </div>
    </div>
  </div></template>

  <!-- All results for this program -->
  <div x-show="all.length" class="rounded-2xl border border-slate-200 bg-white shadow-soft">
    <div class="p-5"><h3 class="font-semibold">All results</h3><p class="text-sm text-slate-500" x-text="E.name"></p></div>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase tracking-wider text-slate-500"><tr><th class="px-5 py-3">Date</th><th class="px-5 py-3">Test</th><th class="px-5 py-3">Score</th><th class="px-5 py-3"></th></tr></thead>
      <tbody class="divide-y divide-slate-100">
        <template x-for="h in all" :key="h.id">
          <tr class="hover:bg-slate-50" :class="att && h.id === att.id && 'bg-accent-soft/40'">
            <td class="whitespace-nowrap px-5 py-3 text-slate-600" x-text="fmtDate(h.date)"></td>
            <td class="whitespace-nowrap px-5 py-3" x-text="DB.packages.find(p => p.id === h.pkg)?.name || h.pkg"></td>
            <td class="whitespace-nowrap px-5 py-3 font-semibold" x-text="isPlacement(h) ? 'Level ' + plLevel(h).code + ' · ' + h.total + '%' : attemptScore(h) == null ? 'Graded by tutor' : fmtScore(attemptScore(h))"></td>
            <td class="whitespace-nowrap px-5 py-3 text-right"><a :href="(isPlacement(h) ? 'placement.html?id=' : 'hasil.html?id=') + h.id" class="mr-3 text-xs font-semibold text-slate-500 hover:underline">Result</a><a :href="'review.html?id=' + h.id" class="text-xs font-semibold text-accent hover:underline">Review</a></td>
          </tr>
        </template>
      </tbody>
    </table></div>
  </div>
</main>

<script>
function hasil() {
  const byId = DB.attempts.find(a => a.id === +qs('id'));
  if (byId && isPlacement(byId)) { location.replace('placement.html?id=' + byId.id); return { att: null, pl: null, all: [] }; }
  const exam = byId?.exam || getExam(), ielts = exam === 'ielts';
  document.documentElement.dataset.exam = exam;
  const fmtScore = v => v == null ? '—' : ielts ? Number(v).toFixed(1) : v;
  const base = { exam, E: DB.exams[exam], fmtScore,
    pl: DB.attempts.find(a => a.exam === exam && isPlacement(a)) || null,
    plPkg: DB.packages.find(p => p.exam === exam && p.type === 'placement'),
    all: DB.attempts.filter(a => a.exam === exam && DB.packages.some(p => p.id === a.pkg)) };
  const att = byId || findAttempt(a => a.exam === exam);
  if (!att) return { ...base, att: null };
  const res = scoreAttempt(att), main = res.total ?? res.sections[0].score; // null = Writing only (waiting for tutor)
  const cefr = main == null ? '—' : ielts ? (main >= 7 ? 'C1' : main >= 5.5 ? 'B2' : main >= 4 ? 'B1' : main >= 3 ? 'A2' : 'A1')
    : res.total === null ? '—' : (main >= 627 ? 'C1' : main >= 543 ? 'B2' : main >= 460 ? 'B1' : main >= 337 ? 'A2' : 'A1');
  const target = DB.user.target[exam];
  return {
    ...base, att, res, cefr,
    wrongCount: res.sections.reduce((a, s) => a + (s.total ? s.total - s.correct : 0), 0),
    main: fmtScore(main), pending: res.sections.some(s => s.pending),
    scale: ielts ? 'out of 9.0' : res.total !== null ? '310–677' : '31–' + (TOEFL_MAX[res.sections[0].id] || 67),
    pct: main == null ? 0 : ielts ? main / 9 : res.total !== null ? (main - 310) / 367 : (main - 31) / ((TOEFL_MAX[res.sections[0].id] || 67) - 31),
    targetText: main == null ? 'Waiting for tutor grading' : res.total === null ? 'Section test' : !target ? '' : main >= target ? 'Target ' + target + ' reached 🎉' : fmtScore(+(target - main).toFixed(1)) + ' below your target of ' + target,
    secPct: s => ielts ? s.score / 9 * 100 : (s.score - 31) / ((TOEFL_MAX[s.id] || 67) - 31) * 100,
  };
}
</script>
</body>
</html>
