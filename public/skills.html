<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/app.js"></script>
</head>
<!-- Latihan soal per skill (section): ?skill=<id section> membuka daftar soalnya -->
<body data-shell="app" data-active="skills" data-title="Skills">
<main x-data="skills()" class="space-y-6">

  <!-- ===== Skill cards ===== -->
  <template x-if="!skill">
    <div class="space-y-6">
      <div>
        <h2 class="text-2xl font-bold tracking-tight" x-text="E.name + ' Skills'"></h2>
        <p class="mt-1 text-slate-500">Practise each skill separately. Pick a skill to see its practice questions with explanations.</p>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <template x-for="(s, i) in cards" :key="s.id">
          <a :href="'skills.html?skill=' + s.id" class="group flex flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-soft transition hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-lg">
            <span class="grid h-14 w-14 place-items-center rounded-2xl bg-accent-soft text-accent" x-html="ico(s.icon, 'h-7 w-7')"></span>
            <h3 class="mt-4 text-lg font-bold group-hover:text-accent" x-text="s.name"></h3>
            <p class="mt-1 text-sm text-slate-500" x-text="s.official ? 'Official test: ' + s.official : ''"></p>
            <div class="mt-auto flex items-center justify-between pt-5 text-sm">
              <span class="font-semibold text-slate-700" x-text="s.office ? 'At our office' : s.count + ' practice questions'"></span>
              <span class="flex items-center gap-1 font-semibold text-accent"><span x-text="s.office ? 'How it works' : 'Practise'"></span> <i data-lucide="arrow-right" class="h-4 w-4"></i></span>
            </div>
          </a>
        </template>
      </div>
      <p x-show="!cards.length" class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-10 text-center text-sm text-slate-500">No practice questions for this program yet.</p>
    </div>
  </template>

  <!-- ===== Section di kantor (mis. Speaking) ===== -->
  <template x-if="skill && skill.office">
    <div class="mx-auto max-w-2xl space-y-5">
      <a href="skills.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-900"><i data-lucide="arrow-left" class="h-4 w-4"></i>All skills</a>
      <div class="rounded-3xl border border-slate-200 bg-white p-6 text-center shadow-soft sm:p-10">
        <span class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-emerald-50 text-emerald-600" x-html="ico(skill.icon || 'mic', 'h-8 w-8')"></span>
        <h2 class="mt-5 text-2xl font-bold" x-text="skill.name"></h2>
        <p x-show="skill.official" class="mt-1 text-sm text-slate-500" x-text="skill.official"></p>
        <p class="mx-auto mt-4 max-w-lg whitespace-pre-line text-left leading-relaxed text-slate-700 sm:text-center" x-text="officeNote(skill)"></p>
        <a :href="officeLink(E, skill)" target="_blank" class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-600 py-3.5 font-semibold text-white hover:bg-emerald-700 sm:w-auto sm:px-8"><i data-lucide="message-circle" class="h-5 w-5"></i>Book via WhatsApp</a>
        <div class="mt-6 flex items-start gap-3 rounded-xl bg-slate-50 p-4 text-left text-sm text-slate-600">
          <i data-lucide="map-pin" class="mt-0.5 h-4 w-4 shrink-0 text-slate-400"></i>
          <div><p class="font-semibold text-slate-800" x-text="DB.contact.name"></p><p x-text="DB.contact.address"></p><p class="text-xs text-slate-500" x-text="DB.contact.hours + ' · WA ' + DB.contact.waLabel"></p></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== Practice list ===== -->
  <template x-if="skill && !skill.office">
    <div class="mx-auto max-w-3xl space-y-5">
      <a href="skills.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-900"><i data-lucide="arrow-left" class="h-4 w-4"></i>All skills</a>
      <div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-soft sm:flex-row sm:items-center">
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-accent-soft text-accent" x-html="ico(skill.icon, 'h-6 w-6')"></span>
        <div class="flex-1"><h2 class="text-xl font-bold" x-text="skill.name + ' Practice'"></h2><p class="text-sm text-slate-500" x-text="items.length + ' questions · answers are checked right away'"></p></div>
        <div class="rounded-xl bg-slate-50 px-4 py-2 text-center text-sm"><p class="text-xs text-slate-500">Correct</p><p class="font-bold"><span class="text-emerald-600" x-text="score"></span> / <span x-text="Object.keys(res).length"></span></p></div>
      </div>

      <template x-for="(q, n) in pageItems" :key="q.id">
        <div class="rounded-2xl border bg-white p-5 shadow-soft sm:p-6" :class="res[q.id] ? (res[q.id].correct ? 'border-emerald-200' : 'border-rose-200') : 'border-slate-200'">
          <div class="flex flex-wrap items-center gap-2 text-xs">
            <span class="rounded-md bg-slate-900 px-2 py-0.5 font-semibold text-white" x-text="'Question ' + (start + n + 1)"></span>
            <span x-show="q.topic" class="rounded-md bg-slate-100 px-2 py-0.5 text-slate-600" x-text="q.topic"></span>
            <span class="rounded-md px-2 py-0.5" :class="diffClass[q.difficulty]" x-text="{ mudah: 'Easy', sedang: 'Medium', sulit: 'Hard' }[q.difficulty]"></span>
          </div>
          <div x-show="q.clip" class="mt-4 flex flex-wrap items-center gap-3 rounded-xl bg-slate-50 p-3" x-data="{ t: false, playing: false }">
            <button @click="playing = true; playClip(DB.clips[q.clip], () => playing = false)" :disabled="playing" class="flex items-center gap-2 rounded-lg bg-accent px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60"><i data-lucide="volume-2" class="h-3.5 w-3.5"></i><span x-text="playing ? 'Playing…' : 'Play audio'"></span></button>
            <button x-show="res[q.id]" @click="t = !t" class="text-xs font-medium text-slate-600 hover:text-slate-900" x-text="t ? 'Hide transcript' : 'Show transcript'"></button>
            <div x-show="t" class="w-full space-y-1 text-sm text-slate-600"><template x-for="l in (DB.clips[q.clip]?.lines || [])"><p><b x-text="l[0] ? l[0] + ':' : ''"></b> <span x-text="l[1]"></span></p></template></div>
          </div>
          <details x-show="q.passage" class="mt-4 rounded-xl bg-slate-50 p-3 text-sm"><summary class="cursor-pointer font-medium text-slate-700" x-text="'Read passage: ' + (DB.passages[q.passage]?.title || '')"></summary>
            <div class="passage thin-scroll mt-3 max-h-72 overflow-y-auto pr-2 leading-relaxed text-slate-600" x-html="DB.passages[q.passage]?.html"></div></details>
          <p x-show="q.instr" class="mt-4 text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="q.instr"></p>
          <p class="stem mt-3 font-medium leading-relaxed text-slate-900" x-html="stemHTML(q)"></p>
          <div x-show="q.type !== 'fill'" class="mt-4 grid gap-2">
            <template x-for="(o, j) in (q.options || [])" :key="j">
              <button @click="check(q, j)" :disabled="q.id in ans" class="flex items-center gap-3 rounded-xl border-2 px-4 py-3 text-left text-sm transition"
                :class="!(q.id in ans) ? 'border-slate-200 hover:border-accent/50 hover:bg-accent-soft' : j === res[q.id]?.answer ? 'border-emerald-500 bg-emerald-50 text-emerald-900' : j === ans[q.id] ? 'border-rose-500 bg-rose-50 text-rose-900' : 'border-slate-100 text-slate-400'">
                <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg text-xs font-bold" :class="!(q.id in ans) ? 'bg-slate-100 text-slate-600' : j === res[q.id]?.answer ? 'bg-emerald-500 text-white' : j === ans[q.id] ? 'bg-rose-500 text-white' : 'bg-slate-100'" x-text="L(j)"></span>
                <span x-text="o"></span>
              </button>
            </template>
          </div>
          <form x-show="q.type === 'fill'" @submit.prevent="if ((fill[q.id] || '').trim()) check(q, fill[q.id])" class="mt-4 flex gap-2">
            <input x-model="fill[q.id]" :disabled="q.id in ans" placeholder="Type your answer…" class="w-full max-w-xs rounded-xl border-2 border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-accent disabled:bg-slate-50">
            <button x-show="!(q.id in ans)" class="rounded-xl bg-accent px-4 text-sm font-semibold text-white hover:bg-accent-dark">Check</button>
          </form>
          <div x-show="res[q.id]" class="mt-4 rounded-xl p-4 text-sm" :class="res[q.id]?.correct ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'">
            <p class="font-semibold"><span x-text="res[q.id]?.correct ? '✅ Correct!' : '❌ Not quite.'"></span>
              <span x-show="res[q.id] && !res[q.id].correct" class="font-normal" x-text="'Correct answer: ' + (res[q.id] ? correctText({ ...q, answer: res[q.id].answer }) : '')"></span></p>
            <p x-show="res[q.id]?.explain" class="mt-2 leading-relaxed text-slate-700"><b>Explanation:</b> <span x-html="res[q.id]?.explain"></span></p>
          </div>
        </div>
      </template>

      <div x-show="pages > 1" class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-3 text-sm shadow-soft">
        <button @click="go(page - 1)" :disabled="page === 1" class="flex items-center gap-1 rounded-lg px-3 py-2 font-semibold hover:bg-slate-50 disabled:opacity-40"><i data-lucide="chevron-left" class="h-4 w-4"></i>Previous</button>
        <span class="text-slate-500" x-text="'Page ' + page + ' of ' + pages"></span>
        <button @click="go(page + 1)" :disabled="page === pages" class="flex items-center gap-1 rounded-lg px-3 py-2 font-semibold hover:bg-slate-50 disabled:opacity-40">Next<i data-lucide="chevron-right" class="h-4 w-4"></i></button>
      </div>
      <p x-show="!items.length" class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-10 text-center text-sm text-slate-500">No practice questions for this skill yet.</p>
    </div>
  </template>
</main>

<script>
function skills() {
  const exam = getExam(), E = DB.exams[exam], PER = 10;
  const bank = s => DB.questions.filter(q => q.exam === exam && q.section === s && (q.pool || 'bank') === 'bank');
  const skill = E.sections.find(s => s.id === qs('skill')) || null;
  const items = skill ? bank(skill.id) : [];
  return {
    E, skill, items, page: 1, ans: {}, fill: {}, res: {},
    cards: E.sections.map(s => ({ ...s, count: bank(s.id).length })).filter(s => s.count || s.office),
    get pages() { return Math.ceil(items.length / PER) || 1; },
    get start() { return (this.page - 1) * PER; },
    get pageItems() { return items.slice(this.start, this.start + PER); },
    get score() { return Object.values(this.res).filter(r => r.correct).length; },
    go(p) { this.page = Math.min(Math.max(1, p), this.pages); scrollTo({ top: 0, behavior: 'smooth' }); },
    async check(q, a) {
      if (q.id in this.ans) return;
      this.ans[q.id] = a;
      try { this.res[q.id] = await api('POST', '/questions/' + q.id + '/check', { answer: a }); }
      catch (e) { delete this.ans[q.id]; alert(e.message); }
    },
  };
}
</script>
</body>
</html>
