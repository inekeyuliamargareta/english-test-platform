<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi — EnglishOn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="data/dummy.js"></script>
<script src="assets/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-shell="app" data-active="materi" data-title="Materi">
<main x-data="materi()">
  <!-- Header -->
  <div class="flex flex-col gap-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-soft md:flex-row md:items-center">
    <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-accent-soft text-accent"><i data-lucide="book-open" class="h-7 w-7"></i></span>
    <div class="flex-1">
      <h2 class="text-xl font-bold">Materi <span x-text="E.name"></span></h2>
      <p class="mt-1 text-sm text-slate-500"><span x-text="all.length"></span> bab dalam <span x-text="E.sections.length"></span> section. Setiap bab berisi penjelasan, contoh, tips, dan latihan soal.</p>
    </div>
    <div class="w-full md:w-56">
      <div class="mb-1.5 flex justify-between text-sm"><span class="text-slate-500">Progres keseluruhan</span><b x-text="overall + '%'"></b></div>
      <div class="h-2.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-accent" :style="'width:' + overall + '%'"></div></div>
    </div>
  </div>

  <!-- Filter -->
  <div class="mt-6 flex flex-col gap-3 lg:flex-row lg:items-center">
    <div class="thin-scroll -mx-4 flex gap-2 overflow-x-auto px-4 pb-1 lg:mx-0 lg:px-0">
      <button @click="sec='all'" class="whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium transition" :class="sec==='all' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'">Semua section</button>
      <template x-for="s in E.sections" :key="s.id">
        <button @click="sec=s.id" class="flex items-center gap-2 whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium transition" :class="sec===s.id ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'"><span x-text="s.short"></span></button>
      </template>
    </div>
    <div class="flex gap-2 lg:ml-auto">
      <div class="relative flex-1 lg:w-64">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input x-model="q" type="search" placeholder="Cari bab…" class="w-full rounded-xl border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm outline-none focus:border-accent focus:ring-4 focus:ring-accent/10">
      </div>
      <select x-model="st" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-accent">
        <option value="all">Semua status</option><option value="new">Belum mulai</option><option value="progress">Sedang dipelajari</option><option value="done">Selesai</option>
      </select>
    </div>
  </div>

  <!-- Skeleton -->
  <div x-show="loading" class="mt-8 grid gap-5 md:grid-cols-2 xl:grid-cols-3"><template x-for="i in 6"><div class="skel h-52"></div></template></div>

  <!-- Daftar per section -->
  <div x-show="!loading" x-cloak class="mt-8 space-y-10">
    <template x-for="s in groups" :key="s.id">
      <section>
        <div class="mb-4 flex items-center gap-3">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-white text-accent shadow-sm ring-1 ring-slate-200"><i :data-lucide="s.icon" class="h-[18px] w-[18px]"></i></span>
          <div><h3 class="font-semibold" x-text="s.name"></h3><p class="text-xs text-slate-500" x-text="'Ujian asli: ' + s.official"></p></div>
          <span class="ml-auto text-sm text-slate-500" x-text="s.items.length + ' bab'"></span>
        </div>
        <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
          <template x-for="c in s.items" :key="c.id">
            <a :href="'materi-detail.html?id=' + c.id" class="group flex flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-soft transition hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-lg">
              <div class="flex items-start justify-between gap-3">
                <span class="rounded-lg px-2 py-1 text-xs font-semibold"
                  :class="{ done: 'bg-emerald-50 text-emerald-700', progress: 'bg-amber-50 text-amber-700', new: 'bg-slate-100 text-slate-600' }[c.status]" x-text="statusLabel[c.status]"></span>
                <span x-show="c.status==='done'" class="grid h-7 w-7 place-items-center rounded-full bg-emerald-500 text-white"><i data-lucide="check" class="h-4 w-4"></i></span>
              </div>
              <h4 class="mt-4 text-[17px] font-semibold group-hover:text-accent" x-text="c.title"></h4>
              <p class="mt-1.5 flex-1 text-sm leading-relaxed text-slate-500" x-text="c.desc"></p>
              <div class="mt-4 flex items-center gap-4 text-xs text-slate-500">
                <span class="flex items-center gap-1"><i data-lucide="layers" class="h-3.5 w-3.5"></i><span x-text="c.subs.length + ' sub-bab'"></span></span>
                <span class="flex items-center gap-1"><i data-lucide="file-question" class="h-3.5 w-3.5"></i><span x-text="c.nq + ' soal'"></span></span>
                <span class="flex items-center gap-1"><i data-lucide="clock" class="h-3.5 w-3.5"></i><span x-text="c.minutes + ' mnt'"></span></span>
              </div>
              <div class="mt-4 flex items-center gap-3">
                <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full" :class="c.status==='done' ? 'bg-emerald-500' : 'bg-accent'" :style="'width:' + c.progress + '%'"></div></div>
                <span class="text-xs font-semibold text-slate-600" x-text="c.progress + '%'"></span>
              </div>
            </a>
          </template>
        </div>
      </section>
    </template>

    <!-- Empty state -->
    <div x-show="!groups.length" class="flex flex-col items-center rounded-2xl border-2 border-dashed border-slate-200 bg-white px-6 py-16 text-center">
      <span class="grid h-14 w-14 place-items-center rounded-2xl bg-slate-100 text-slate-400"><i data-lucide="search-x" class="h-7 w-7"></i></span>
      <h4 class="mt-4 font-semibold">Bab tidak ditemukan</h4>
      <p class="mt-1 max-w-sm text-sm text-slate-500">Coba kata kunci lain atau ubah filter section dan status.</p>
      <button @click="q=''; sec='all'; st='all'" class="mt-5 rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-accent-dark">Reset filter</button>
    </div>
  </div>
</main>

<script>
function materi() {
  const exam = getExam(), E = DB.exams[exam];
  const all = DB.chapters.filter(c => c.exam === exam).map(c => ({ ...c, nq: DB.questions.filter(q => q.chapter === c.id).length }));
  return {
    E, all, sec: qs('section') || 'all', st: 'all', q: '', loading: true,
    overall: Math.round(all.reduce((a, c) => a + c.progress, 0) / all.length),
    get groups() {
      const k = this.q.toLowerCase();
      return E.sections.filter(s => this.sec === 'all' || s.id === this.sec)
        .map(s => ({ ...s, items: all.filter(c => c.section === s.id && (this.st === 'all' || c.status === this.st) && (c.title + c.desc).toLowerCase().includes(k)) }))
        .filter(s => s.items.length);
    },
    init() { setTimeout(() => this.loading = false, 450); },
  };
}
</script>
</body>
</html>
